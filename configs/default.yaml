# AdaPres default configuration. All tunables live here; nothing is hardcoded in src/.
# Paths are Kaggle paths; notebooks may override them via their CONFIG cell.

seed: 2027

paths:
  # Kaggle mounts an attached dataset at /kaggle/input/<slug>. Discovery searches
  # under input_root for the BDD folders, so a different mount layout still works.
  input_root: /kaggle/input
  bdd_dataset_slug: tcjpaperdatasets
  work_root: /kaggle/working
  results_dir: results        # relative to work_root
  data_dir: data              # relative to work_root (derived, never committed)
  logs_dir: logs              # relative to work_root

bdd:
  # Folder names expected somewhere inside the attached dataset (D1 in README).
  images_dir_name: track_images_val
  labels_dir_name: box_track_labels_trainval
  label_split: val            # only MOT val is used (calib and test both from val)
  # Seeded, disjoint, stratified selection of clips from MOT val.
  subsets:
    calib:
      n_sequences: 20
      strata_targets: {daytime: 12, night: 6, dawn_dusk: 2}
    test:
      n_sequences: 40
      strata_targets: {daytime: 24, night: 12, dawn_dusk: 4}
    int8_calib_frames: 500    # sampled from calib sequences only
  smoke:
    calib:
      n_sequences: 3
      strata_targets: {daytime: 2, night: 1, dawn_dusk: 0}
    test:
      n_sequences: 3
      strata_targets: {daytime: 2, night: 1, dawn_dusk: 0}
    int8_calib_frames: 50

slices:
  crowded_percentile: 90      # of per-frame GT count on calib
  easy_max_count: median      # GT count <= median calib GT count
  natural_scene_change:
    new_track_ratio: 0.5
    min_tracks: 3
  easy_excludes_natural_scene_change: true

splice:
  n_streams: 20
  segment_len: 40
  min_segments: 2
  max_segments: 3
  window: 5                   # frames after a splice point labelled scene_change
  smoke_n_streams: 2

classmap:
  # How BDD ignore classes are written into COCO GT. "all_eval_classes" duplicates
  # each ignore box as an iscrowd=1 box for every evaluated category, so a detection
  # of any class on that region is ignored rather than counted as a false positive.
  ignore_mode: all_eval_classes

model:
  name: yolo11s
  weights: yolo11s.pt         # downloaded by Ultralytics on Kaggle (internet on); SHA-256 recorded
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 300
  conf_cue: 0.25              # tau_c
  rect: false                 # square 640x640 letterbox for every backend (static engines need it)
  # PLAN §1.2 pre-registered rule: if INT8 median engine latency is < 10% below FP16,
  # also run yolo11m and use whichever has the larger FP16->INT8 gap.
  size_rule_min_int8_speedup: 0.10

eval:
  max_dets: 300               # pycocotools maxDets[-1]; AP read via eval/coco_metrics.py (D4)
  perframe_iou: 0.5           # per-frame F1@0.5 (oracle proxy, PLAN §6)
  ignore_ioa: 0.5             # detection on an ignore box if intersection/det-area >= this

features:                      # PLAN §3.1 raw cues (image-only cues are cached once per frame)
  width: 320                  # downscaled grayscale width
  canny_low: 100
  canny_high: 200
  hist_bins: 32               # HSV (H,S) 2-D histogram bins per channel

controller:                    # PLAN §3.3-3.4. DEV DEFAULTS; the locked config comes from 04b (calib)
  levels: [int8, fp16]        # cheapest -> most expensive; FP32 is a baseline only
  start_level: fp16
  weights: {m: 0.2, c: 0.2, n: 0.2, u: 0.2, s: 0.2}
  alpha: 0.6                  # EMA; 1.0 disables
  theta_quantile: 0.5         # theta = this quantile of S_hat on calib (open-loop, FP16-detection cues)
  K: 2                        # persistence; K_up/K_down default to K
  K_up: null
  K_down: null
  H: 3                        # frames held at FP16 after a scene-change override
  theta_sc: 0.4               # Bhattacharyya distance for the binary scene-change cue
  u_empty: 0.0                # uncertainty when the previous frame has no detections
  scene_override: true
  w_h: 0.0                    # hardware term off (nice-to-have, RQ6)
  norm_percentiles: [5, 95]   # fit on calib only

step3:                         # notebook 03: controller + baselines replayed on the calib cache
  split: calib
  smoke_n_sequences: 2
  K_sweep: [1, 2, 3, 5]       # dev view of hysteresis (H3 preview), theta fixed at the dev value
  random_seeds: 10
  iid_p_int8: 0.5

full:                          # notebook 04: everything left, one run, gated stages (decision 2026-11-20)
  exp_prefix: r04_            # never reuse earlier notebooks' experiment ids
  gate_calib_map_tol_pts: 0.5 # rebuilt engines vs committed Step 2 calib mAP50-95 (all slices)
  delta_pts: 0.5              # must equal configs/preregistration.yaml delta_map_points
  calib:
    theta_quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
    Ks: [1, 2, 3, 5]
    alphas: [0.6, 1.0]
    theta_scs: [0.3, 0.4, 0.5]
    simplex_step: 0.25        # 70 weight vectors + equal weights
    stage_a_f1_slack: 0.02    # proxy: mean per-frame F1 within this of FP16
    stage_b_top: 20
    stage_b_max: 200
    pareto_deltas: [0.25, 0.5, 1.0, 2.0]
    ablation_stage_b_top: 10
    ablation_stage_b_max: 40
    K_sweep: [1, 2, 3, 5, 8]  # theta fixed at the locked value
  smoke_calib:
    theta_quantiles: [0.25, 0.5, 0.75]
    Ks: [1, 2]
    alphas: [1.0]
    theta_scs: [0.4]
    simplex_step: 0.5
    stage_b_top: 3
    stage_b_max: 6
    ablation_stage_b_top: 2
    ablation_stage_b_max: 4
  test:
    smoke_n_sequences: 2
    random_seeds: 10
    bootstrap_resamples: 1000
    smoke_bootstrap_resamples: 30
  timing:
    n_measure_clips: 2
    frames_per_clip: 150
    warmup_s: 20
    settle_s: 60
    idle_s: 30
    measure_s: 60
    repeats: 3
    switch_penalty_frames: 200
  smoke_timing:
    n_measure_clips: 1
    frames_per_clip: 40
    warmup_s: 2
    settle_s: 0
    idle_s: 3
    measure_s: 5
    repeats: 1
    switch_penalty_frames: 40
  live_validation:
    frac_clips: 0.25
    smoke_n_clips: 1
    soft_min_level_agreement: 0.9   # reported; below this the stage records a warning (PLAN: report the gap)

step2:                         # notebook 02: fixed FP32/FP16/INT8 on calib clips only
  split: calib
  levels: [fp32, fp16, int8]
  pt_reference: true          # also run the PyTorch .pt FP32 model as a sanity reference
  n_sequences: 20             # all calib clips
  smoke_n_sequences: 2
  warmup_frames: 50           # discarded per engine before timing (PLAN §2.3)
  microbench_iters: 300
  microbench_warmup: 50
  val_check_frames: 200       # PLAN §5.3 pipeline vs model.val() check (D6: BDD calib frames)
  smoke_val_check_frames: 50
  int8_batch: 1
  sanity:
    fp16_vs_fp32_max_abs_pts: 0.5    # |mAP50-95(FP16) - mAP50-95(FP32)| in points
    trt_fp32_vs_pt_max_abs_pts: 0.5  # TensorRT FP32 vs PyTorch FP32
    int8_max_drop_pts: 3.0           # INT8 "slightly lower": drop vs FP16 must be <= this
    int8_max_gain_pts: 0.5           # INT8 better than FP16 by more than this is suspicious
    val_check_max_abs_pts: 0.5       # tolerance for the model.val() comparisons (pts)
    # Option 1 (decision 2026-11-20, README D7): all policies use single-label predict().
    # Binding agreement = notebook 02b: |C-B| <= tol on BOTH metrics (identical predictions,
    # our evaluator vs Ultralytics' metric) AND the predict-vs-val gap explained by NMS mode.
    # End-to-end |C-A| is reported but not binding. Thresholds set after seeing the 02b smoke
    # run (ours 0.0005, theirs 0.405, matched 1.0/0.983); recorded as such in D7.
    val_diag:
      ours_dup_other_class_max: 0.01   # single-label NMS: (almost) no same-box-other-class duplicates
      theirs_dup_other_class_min: 0.10 # multi-label NMS signature in model.val() predictions
      high_conf_match_min: 0.95        # conf >= 0.25 boxes agree (both directions, IoU >= 0.9)

env:
  cuda_visible_devices: "0"
  energy_probe_seconds: 5
  # TensorRT (via Ultralytics) is the main path. ONNX Runtime GPU is only the INT8
  # fallback (PLAN §9 risk triggers), so a failed ORT CUDA probe is recorded and
  # printed as a WARNING instead of stopping the notebook. Set true to make it fatal.
  require_ort_cuda: false
